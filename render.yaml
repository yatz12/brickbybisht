services:
  - type: web
    name: brick-by-bisht
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    disk:
      name: brick-by-bisht-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: INQUIRY_DATABASE_PATH
        value: /var/data/inquiries.sqlite
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
